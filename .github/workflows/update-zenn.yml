name: Update Zenn Articles in README

on:
  schedule:
    # 毎日 08:00 JST (23:00 UTC) に Zenn フィードを同期
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-zenn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest Zenn articles
        run: python3 scripts/update_zenn_posts.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): sync latest Zenn articles"
          git push
