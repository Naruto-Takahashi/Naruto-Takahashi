    .yellow { font-size: 14px; fill: #c4b28a; }
    .accent { font-size: 14px; fill: #a2c9fd; }
    .tabtext { font-size: 13px; fill: #111418; font-weight: 700; }
    .promptseg { font-size: 14px; }
    .cursor { fill: #c8c093; animation: blink 1s steps(2, start) infinite; }
