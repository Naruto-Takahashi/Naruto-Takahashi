ight="bold"> main </text><text x="34" y="371" class="cmdline"><tspan class="promptchar" font-weight="bold">&#10095;</tspan> <tspan class="typeline" style="animation-delay:4.41s;animation-duration:1.04s"><tspan class="syn-func">stack</tspan> <tspan class="syn-storage">--core</tspan></tspan></text></g><g class="reveal" style="animation-delay:5.60s"><text x="34" y="399" class="mono"><tspan class="syn-func">Python</tspan><tspan class="dim"> · </tspan><tspan class="syn-storage">C / C++</tspan><tspan class="dim"> · </tspan><tspan class="syn-class">Nix</tspan><tspan class="dim"> · </tspan><tspan class="syn-const">TypeScript</tspan><tspan class="dim"> · </tspan><tspan class="syn-func">Neovim</tspan></text></g><g class="reveal" style="animation-delay:6.40s"><rect x="34" y="425" width="108" height="15" fill="#a2c9fd"/><rect x="142" y="425" width="66" height="15" fill="#272a2f"/><polygon points="142,425 148,432.5 142,440" fill="#a2c9fd"/><polygon points="208,425 214,432.5 208,440" fill="#272a2f"/><text x="88.0" y="435.7" class="barseg" text-anchor="middle" fill="#111418" font-weight="bold"> ~/Naruto-Takahashi </text><g stroke="#a2c9fd" stroke-width="1.3" fill="none" stroke-linecap="round"><line x1="157" y1="429.5" x2="157" y2="435.5"/><path d="M 157 432.0 C 159.5 432.0 160.5 430.0 163 430.0"/></g><circle cx="157" cy="428.0" r="1.5" fill="#a2c9fd"/><circle cx="157" cy="437.0" r="1.5" fill="#a2c9fd"/><circle cx="163" cy="430.0" r="1.5" fill="#a2c9fd"/><text x="171" y="435.7" class="barseg" fill="#a2c9fd" font-weight="bold"> main </text><text x="34" y="462" class="promptchar" font-weight="bold">&#10095;</text><rect x="48" y="451" width="6" height="13" rx="1" class="cursor"/></g>

  <rect x="0.75" y="26" width="898.5" height="455.25" fill="url(#scanlines)" class="scanlines" pointer-events="none"/>
