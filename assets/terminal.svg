  <text x="34" y="74" class="title">naruto@wezterm</text><text x="34" y="100" class="dim">──────────────────────────────────────────────────────────────────────────────</text><text x="34" y="136" class="prompt">$ whoami</text><text x="34" y="164" class="mono">Role        Security &amp; Privacy Researcher (B4)</text><text x="34" y="188" class="mono">University  Kyushu University, Faculty of Engineering</text><text x="34" y="212" class="mono">Lab         Sakurai Laboratory</text><text x="34" y="236" class="mono">Location    Fukuoka, Japan</text><text x="34" y="276" class="prompt">$ research --current</text><text x="34" y="300" class="green">[RUNNING] Human-Computable Passwords</text><text x="34" y="340" class="prompt">$ cat research.txt</text><text x="34" y="364" class="mono">Benchmarking authentication schemes a human can compute by hand,</text><text x="34" y="388" class="mono">evaluating LLM limits in both rule execution (deduction) and</text><text x="34" y="412" class="mono">rule inference (induction).</text><text x="34" y="452" class="prompt">$ stack --list</text><text x="34" y="480" class="mono">Python · Rust · Nix / Home Manager · ghq</text><text x="34" y="520" class="prompt">$ env --list</text><text x="34" y="548" class="mono">OS       WSL2 (Windows 11) · macOS (Apple Silicon) · NixOS</text><text x="34" y="572" class="mono">Editor   Neovim + WezTerm</text><text x="34" y="596" class="mono">WM       komorebi + YASB (Win) / Hyprland (NixOS) / AeroSpace (Mac)</text><text x="34" y="636" class="prompt">$ projects --active</text><text x="34" y="664" class="dim">PID   PROJECT                         STATUS</text><text x="34" y="688" class="mono">001   human-computable-passwords      running</text>

