<svg width="900" height="482" viewBox="0 0 900 482" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "HackGen Console NF", "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }
    .bg { fill: #181616; }
    .border { stroke: #282727; stroke-width: 1.5; }
    .mono { font-size: 14px; fill: #c5c9c5; }
    .title { font-size: 16px; font-weight: 700; fill: #d7bde4; }
    .cmdline { font-size: 14px; fill: #c5c9c5; }
    .promptchar { fill: #bbc7db; font-size: 14px; }
    .dim { font-size: 14px; fill: #737c73; }
    .green { font-size: 14px; fill: #87a987; }
    .yellow { font-size: 14px; fill: #c4b28a; }
    .accent { font-size: 14px; fill: #a2c9fd; }
    .syn-func { fill: #8ba4b0; }
    .syn-storage { fill: #8992a7; }
    .syn-class { fill: #8ea4a2; }
    .syn-string { fill: #8a9a7b; }
    .syn-const { fill: #b6927b; }
    .tabtext { font-size: 12px; fill: #111418; font-weight: 700; }
    .tabtext-inactive { font-size: 12px; fill: #c3c6cf; font-weight: 700; }
    .barseg { font-size: 10px; }
    .cursor { fill: #d7bde4; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* タイピング再生 (1回完結): ブロックが上からフェード+スライドインで
       順番に出現する。prefers-reduced-motionでは分岐させない
       (Vivaldi等、OS側の「モーションを減らす」設定が意図せずオンになっていると
       それだけでアニメーションが再生されなくなってしまうため、常に再生する)。
       その代わり、静的なopacity/clip-pathの宣言としては「常にフル表示」
       (opacity:1 / clip-path:フル開放) だけを書き、非表示状態は
       @keyframesの0%側にしか存在しないようにしている。こうすることで
       librsvg等アニメーションを実行できないレンダラは単に静的な
       opacity:1をそのまま使い、対応ブラウザだけがアニメーション通りに
       0%から再生する(=静的レンダラでも真っ黒にならない)。 */
    .reveal {
      opacity: 1;
      animation: revealIn 0.5s ease-out both;
    }
    /* コマンド文字列だけ、バーの出現から少し遅れて左→右にタイプされる演出。
       等速だと不自然なので、バーストと一瞬の"打鍵の迷い"を混ぜた不均一な
       キーフレームにし、animation-durationは文字数で個別に伸縮させている
       (prompt_and_command/type_duration参照)。2種類のカーブ(typeline-b)を
       コマンドごとに交互適用し、毎回同じリズムに見えないようにした。 */
    .typeline {
      display: inline-block;
      clip-path: inset(0 0 0 0);
      animation-name: typeReveal;
      animation-timing-function: linear;
      animation-fill-mode: both;
    }
    .typeline-b { animation-name: typeReveal2; }
    @keyframes revealIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* 序盤は勢いよく、途中で一瞬迷って止まり、後半また打ち切る緩急 */
    @keyframes typeReveal {
      0%   { clip-path: inset(0 100% 0 0); }
      22%  { clip-path: inset(0 74% 0 0); }
      30%  { clip-path: inset(0 71% 0 0); }
      46%  { clip-path: inset(0 46% 0 0); }
      52%  { clip-path: inset(0 44% 0 0); }
      74%  { clip-path: inset(0 16% 0 0); }
      100% { clip-path: inset(0 0% 0 0); }
    }
    /* variant B: 迷いのタイミングをずらした別カーブ */
    @keyframes typeReveal2 {
      0%   { clip-path: inset(0 100% 0 0); }
      12%  { clip-path: inset(0 88% 0 0); }
      34%  { clip-path: inset(0 58% 0 0); }
      40%  { clip-path: inset(0 56% 0 0); }
      62%  { clip-path: inset(0 30% 0 0); }
      68%  { clip-path: inset(0 28% 0 0); }
      100% { clip-path: inset(0 0% 0 0); }
    }

    /* 常時ループするスキャンライン(CRT風の走査線) */
    .scanlines {
      mix-blend-mode: overlay;
      animation: scanmove 5s linear infinite;
    }
    @keyframes scanmove {
      from { transform: translateY(0); }
      to   { transform: translateY(4px); }
    }
  </style>

  <rect x="0.75" y="0.75" width="898.5" height="480.5" rx="12" class="bg border"/>

  <path d="M 0.75 12.75 Q 0.75 0.75 12.75 0.75 L 887.25 0.75 Q 899.25 0.75 899.25 12.75
           L 899.25 26 L 0.75 26 Z" fill="#1d1c19"/>
  <line x1="0.75" y1="26" x2="899.25" y2="26" stroke="#282727" stroke-width="1"/>

  <circle cx="22" cy="13.0" r="4.5" fill="#c4746e"/>
  <circle cx="39" cy="13.0" r="4.5" fill="#c4b28a"/>
  <circle cx="56" cy="13.0" r="4.5" fill="#87a987"/>

  <g class="reveal" style="animation-delay:0.25s"><rect x="34" y="48" width="108" height="15" fill="#a2c9fd"/><rect x="142" y="48" width="66" height="15" fill="#272a2f"/><polygon points="142,48 148,55.5 142,63" fill="#a2c9fd"/><polygon points="208,48 214,55.5 208,63" fill="#272a2f"/><text x="88.0" y="58.7" class="barseg" text-anchor="middle" fill="#111418" font-weight="bold"> ~/Naruto-Takahashi </text><g stroke="#a2c9fd" stroke-width="1.3" fill="none" stroke-linecap="round"><line x1="157" y1="52.5" x2="157" y2="58.5"/><path d="M 157 55.0 C 159.5 55.0 160.5 53.0 163 53.0"/></g><circle cx="157" cy="51.0" r="1.5" fill="#a2c9fd"/><circle cx="157" cy="60.0" r="1.5" fill="#a2c9fd"/><circle cx="163" cy="53.0" r="1.5" fill="#a2c9fd"/><text x="171" y="58.7" class="barseg" fill="#a2c9fd" font-weight="bold"> main </text><text x="34" y="85" class="cmdline"><tspan class="promptchar" font-weight="bold">&#10095;</tspan> <tspan class="typeline" style="animation-delay:0.37s;animation-duration:0.77s"><tspan class="syn-func">whoami</tspan></tspan></text></g><g class="reveal" style="animation-delay:1.29s"><text x="34" y="113" class="mono"><tspan x="34" class="syn-storage">Role</tspan><tspan x="158">AI &amp; Security Researcher / Systems Engineer</tspan></text><text x="34" y="137" class="mono"><tspan x="34" class="syn-storage">Affiliation</tspan><tspan x="158">Kyushu Univ. — Sakurai Laboratory</tspan></text><text x="34" y="161" class="mono"><tspan x="34" class="syn-storage">Interests</tspan><tspan x="158">LLM Security · AI Agents · Declarative Infra</tspan></text></g><g class="reveal" style="animation-delay:2.09s"><rect x="34" y="191" width="108" height="15" fill="#a2c9fd"/><rect x="142" y="191" width="66" height="15" fill="#272a2f"/><polygon points="142,191 148,198.5 142,206" fill="#a2c9fd"/><polygon points="208,191 214,198.5 208,206" fill="#272a2f"/><text x="88.0" y="201.7" class="barseg" text-anchor="middle" fill="#111418" font-weight="bold"> ~/Naruto-Takahashi </text><g stroke="#a2c