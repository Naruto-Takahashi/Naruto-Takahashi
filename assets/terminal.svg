<svg width="900" height="941" viewBox="0 0 900 941" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="2" fill="#000000" opacity="0.35"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "HackGen Console NF", "SFMono-Regular", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }
    .bg { fill: #181616; }
    .border { stroke: #282727; stroke-width: 1.5; }
    .mono { font-size: 14px; fill: #c5c9c5; }
    .title { font-size: 16px; font-weight: 700; fill: #a2c9fd; }
    .cmdline { font-size: 14px; fill: #c5c9c5; }
    .promptchar { fill: #bbc7db; font-size: 14px; }
    .dim { font-size: 14px; fill: #737c73; }
    .green { font-size: 14px; fill: #87a987; }
    .yellow { font-size: 14px; fill: #c4b28a; }
    .accent { font-size: 14px; fill: #a2c9fd; }
    .tabtext { font-size: 12px; fill: #111418; font-weight: 700; }
    .barseg { font-size: 10px; }
    .barright { font-size: 10px; font-weight: 700; fill: #c3c6cf; }
    .cursor { fill: #c8c093; animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* タイピング再生 (1回完結): ブロックが上からフェード+スライドインで
       順番に出現する。librsvg等の静的レンダラやreduced-motion環境は
       @media を解釈できず/評価がfalseになり、下の「常に表示」がそのまま
       効くようフォールバックにしている (これが無いと、アニメーション未再生の
       環境で opacity:0 のまま止まって真っ黒に見えてしまう)。 */
    .reveal { opacity: 1; }
    .typeline { display: inline-block; clip-path: inset(0 0 0 0); }
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translateY(5px);
        animation: revealIn 0.5s ease-out both;
      }
      /* コマンド文字列だけ、バーの出現から少し遅れて左→右にタイプされる演出 */
      .typeline {
        clip-path: inset(0 100% 0 0);
        animation: typeReveal 0.5s steps(18, end) both;
      }
    }
    @keyframes revealIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes typeReveal {
      to { clip-path: inset(0 0 0 0); }
    }

    /* 常時ループするスキャンライン(CRT風の走査線) */
    .scanlines {
      mix-blend-mode: overlay;
      animation: scanmove 5s linear infinite;
    }
    @keyframes scanmove {
      from { transform: translateY(0); }
      to   { transform: translateY(4px); }
    }
  </style>

